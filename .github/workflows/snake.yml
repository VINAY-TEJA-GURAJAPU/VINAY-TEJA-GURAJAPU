name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"   # regenerates every 6 hours
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVGs + GIF
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: VINAY-TEJA-GURAJAPU
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2336BCF7&color_dots=%230F2027,%23203A43,%232C5364,%2336BCF7,%2358CBFF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=%2336BCF7&color_dots=%230F2027,%23203A43,%232C5364,%2336BCF7,%2358CBFF&color_background=%230D1117
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
